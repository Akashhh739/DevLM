[project]
name = "openclaw"
version = "0.1.0"
description = "On-demand DevSecOps analyst: snapshot logs to Parquet and analyze them against your local code, rules, and memory."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pytz>=2024.1",  # duckdb needs it to convert TIMESTAMPTZ (the `ts` column) to Python
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "typer>=0.12",
    "python-dotenv>=1",
    "structlog>=24",
    # analyze step (wired next):
    "openai>=1.40",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
aws = ["boto3>=1.34"]
ga4 = ["google-analytics-data>=0.18"]
trace = ["langsmith>=0.1"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
archive = ["boto3>=1.34"]
analytics = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4"]
postgres = ["psycopg[binary]>=3.1"]  # also used by the supabase connector
k8s = ["kubernetes>=29"]

[project.scripts]
openclaw = "openclaw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
